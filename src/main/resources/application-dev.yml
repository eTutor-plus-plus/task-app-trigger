# Logging
logging:
  level:
    ROOT: info
    at.jku.dke: trace

# Data
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: etutor
    password: etutor-secret
  jpa:
    show-sql: true
  docker:
    compose:
      lifecycle-management: start-only

# Springdoc
springdoc:
  show-actuator: true

# JDBC
jdbc:
  url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
  admin:
    username: etutor
    password: etutor-secret
  executor:
    username: etutor_sql_executor
    password: etutor_sql_executor_pwd
  max-pool-size: 5
  max-lifetime: 1800000 # 30 minutes
  connection-timeout: 15000 # 15 seconds

# API key definition
clients:
  api-keys:
    - name: task-administration
      key: task-admin-key
      roles:
        - CRUD
        - SUBMIT
    - name: jobe-server
      key: jobe-server-key
      roles:
        - SUBMIT
    - name: plag-check
      key: plag-check-key
      roles:
        - READ_SUBMISSION

sql-url: http://localhost:8080/api/forwardPublic/sql/query/
